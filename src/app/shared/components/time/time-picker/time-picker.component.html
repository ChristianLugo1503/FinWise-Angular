<div class="group relative mb-5 border-2 border-white rounded-lg px-2 flex">
  <label
    class="user-label font-semibold text-lg group-[.errorCategory]:text-[#C92628]"
    >Hora de recordatorio:</label
  >

  <input
    class="h-4 mt-3 w-full bg-transparent border-none text-white focus:outline-none focus-visible:border-none cursor-pointer"
    [ngxTimepicker]="toggleIcon"
    [disableClick]="true"
    ngxMaterialTimepickerToggleIcon
    readonly
    (click)="toggleIcon.open()"
    [(ngModel)]="defaultTime"
    [value]="defaultTime"
  />
  <ngx-material-timepicker-toggle
    [for]="toggleIcon"
    class="h-full flex items-center justify-center"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 30"
      width="30px"
      height="30px"
      ngxMaterialTimepickerToggleIcon
      class="text-white hover:scale-125 transition ease-in-out duration-500"
    >
      <path
        d="M15,3C8.373,3,3,8.373,3,15c0,6.627,5.373,12,12,12s12-5.373,12-12C27,8.373,21.627,3,15,3z M16,16H7.995 C7.445,16,7,15.555,7,15.005v-0.011C7,14.445,7.445,14,7.995,14H14V5.995C14,5.445,14.445,5,14.995,5h0.011 C15.555,5,16,5.445,16,5.995V16z"
        fill="white"
      />
    </svg>
  </ngx-material-timepicker-toggle>

  <!-- Capturar la hora seleccionada -->
  <ngx-material-timepicker
    #toggleIcon
    class="z-[9999] relative"
    (timeSet)="onTimeSet($event)"
  ></ngx-material-timepicker>
</div>
