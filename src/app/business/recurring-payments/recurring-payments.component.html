<div class="h-full w-full">
  <div class="flex flex-col sm:flex-row justify-end mr-2">
    <div class="flex items-center w-full mr-2">
      <div class="relative w-full">
        <input
          class="w-full bg-[#111A3D] placeholder:text-slate-400 text-white text-sm rounded-md pl-3 pr-28 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 shadow-sm focus:shadow"
          placeholder="Buscar..."
        />
        <button
          class="absolute top-2 right-2 flex items-center rounded border border-transparent text-center text-xs font-semibold text-white transition-all shadow-sm hover:scale-125 disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none active:animate-jump"
          type="button"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="tabs flex flex-row justify-end">
      <div
        (click)="setActiveTab('Gasto')"
        [ngClass]="{
          'bg-[#111A3D] text-white font-bold': activeTab === 'Gasto',
          'bg-[#0E1635]': activeTab !== 'Gasto'
        }"
        class="flex items-center justify-center h-12 w-24 cursor-pointer rounded-t-lg active:bg-[#172147] hover:scale-105 transition duration-400 ease-in-out"
      >
        <p>Gastos</p>
      </div>

      <div
        (click)="setActiveTab('Ingreso')"
        [ngClass]="{
          'bg-[#111A3D] text-white font-bold': activeTab === 'Ingreso',
          'bg-[#0E1635]': activeTab !== 'Ingreso'
        }"
        class="flex items-center justify-center h-12 w-24 cursor-pointer rounded-t-lg active:bg-[#172147] hover:scale-105 transition duration-400 ease-in-out mr-2"
      >
        <p>Ingresos</p>
      </div>
    </div>
  </div>

  <div class="h-[92%] bg-[#111A3D] rounded-lg flex flex-col">
    <h1 class="text-white font-bold px-4 pt-2">Lista de pagos recurrentes:</h1>

    <div class="h-full overflow-y-auto mt-2 px-4 pt-2">
      <div
        *ngFor="let payment of payments"
        class="flex bg-[#111A3D] w-full items-center justify-between p-3 transition duration-400 ease-in-outS rounded-lg mb-3 h-14 shadow-[0px_0px_15px_-5px_rgba(255,_255,_255,_0.1)] hover:shadow-[0px_0px_15px_1px_rgba(255,_255,_255,_0.1)] hover:scale-[1.01]"
      >
        <div class="flex flex-row items-center">
          <img class="w-10 mr-2" src="{{ payment.image }}" alt="" />
          <div class="flex flex-col items-start">
            <p class="text-sm text-white font-bold">Nombre:</p>
            <p class="text-sm text-white font-normal">{{ payment.name }}</p>
          </div>
        </div>

        <div class="flex flex-col items-center space-x-3">
          <p class="text-sm text-white font-bold">Frecuencia:</p>
          <p class="text-sm text-white font-normal">{{ payment.frequency }}</p>
        </div>

        <div class="flex flex-col items-center space-x-3">
          <p class="text-sm text-white font-bold">Hora:</p>
          <p class="text-sm text-white font-normal">
            {{ payment.reminderTime }}
          </p>
        </div>

        <div class="flex flex-col items-center space-x-3">
          <p class="text-sm text-white font-bold">Comentario:</p>
          <p class="text-sm text-white font-normal">{{ payment.comment }}</p>
        </div>

        <div class="flex flex-col items-center space-x-3">
          <p class="text-sm text-white font-bold">Cantidad:</p>
          <p class="text-sm text-white font-normal">
            {{ payment.amount | customCurrency }}
          </p>
        </div>

        <div class="flex items-center space-x-3">
          <!-- EDIT -->
          <button (click)="editTrans(payment)" title="Editar transacción">
            <svg
              class="stroke-current text-white hover:text-[#FF8000] cursor-pointer hover:scale-125 transition duration-400 ease-in-out"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M20.1497 7.93997L8.27971 19.81C7.21971 20.88 4.04971 21.3699 3.27971 20.6599C2.50971 19.9499 3.06969 16.78 4.12969 15.71L15.9997 3.84C16.5478 3.31801 17.2783 3.03097 18.0351 3.04019C18.7919 3.04942 19.5151 3.35418 20.0503 3.88938C20.5855 4.42457 20.8903 5.14781 20.8995 5.90463C20.9088 6.66146 20.6217 7.39189 20.0997 7.93997H20.1497Z"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M21 21H12"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <!-- DELETE -->
          <button (click)="deleteBtn(payment.id)" title="Eliminar transacción">
            <svg
              class="stroke-current text-white hover:text-red-600 cursor-pointer hover:scale-125 transition duration-400 ease-in-out"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10 11V17"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14 11V17"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M4 7H20"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6 7H12H18V18C18 19.6569 16.6569 21 15 21H9C7.34315 21 6 19.6569 6 18V7Z"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div class="h-full flex items-center justify-center">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                class="sr-only peer"
                [checked]="payment.status"
                (change)="changeStatus(payment.id, payment.status)"
              />
              <div
                class="relative w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"
              ></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="flex-shrink-0 flex justify-end">
      <button
        (click)="addRecurringPayment(activeTab)"
        class="bg-white py-2 px-2 rounded-lg text-[#0A1232] text-xs font-semibold hover:scale-105 transition duration-400 ease-in-out flex items-center justify-center"
      >
        + Agregar
      </button>
    </div>
  </div>
</div>
